# One command to run the whole system:   docker compose up --build
#
#   db       PostgreSQL 17 (persistent volume)
#   migrate  one-shot: applies migrations, then seeds demo data (idempotent)
#   api      NestJS API          http://localhost:3001
#   web      Next.js web app     http://localhost:3000
#
# Start order is enforced with health checks, not sleeps.

name: patients-management

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://patients:patients@db:5432/patients?schema=public
  JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-in-any-real-deployment}
  JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-1800}
  CORS_ORIGINS: http://localhost:3000
  # The web BFF is the single proxy hop in front of the API.
  TRUST_PROXY_HOPS: 1
  # Swagger UI at http://localhost:3001/docs (off by default when NODE_ENV=production).
  API_DOCS_ENABLED: 'true'
  LOG_LEVEL: info
  THROTTLE_LOGIN_LIMIT: ${THROTTLE_LOGIN_LIMIT:-10}
  CHAOS_ENABLED: ${CHAOS_ENABLED:-true}
  CHAOS_FAILURE_RATE: ${CHAOS_FAILURE_RATE:-0.15}
  CHAOS_LATENCY_MIN_MS: ${CHAOS_LATENCY_MIN_MS:-50}
  CHAOS_LATENCY_MAX_MS: ${CHAOS_LATENCY_MAX_MS:-500}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: patients
      POSTGRES_PASSWORD: patients
      POSTGRES_DB: patients
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patients -d patients']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    environment:
      <<: *api-env
      SEED_DEMO_DATA: 'true'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment: *api-env
    # Published on loopback only, for curl/REST-client exploration. In real deployments the API
    # has no public ingress at all: browsers reach it exclusively through the web BFF.
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3001
      # Cookies over plain http://localhost need Secure=false; behind TLS leave this unset.
      SESSION_COOKIE_SECURE: 'false'
      # Local demo only: one-click sign-in buttons on the login page.
      DEMO_ACCOUNTS: 'true'
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
